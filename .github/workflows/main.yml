
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'wrangler.toml'
      - 'build.sh'
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
      - name: Clone Another Public Repo
        uses: actions/checkout@v6
        with:
          repository: 'CollegesChat/website-generator'
          path: 'generator'
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: "generator/uv.lock"
      - name: Build Markdown
        run: scripts/build_markdown.sh
      - name: Assign per-province URLs
        # 各省要有独立网址，index.json 才有落点；否则 36 个省全压到 /universities/ 互相覆盖
        run: python3 scripts/assign_province_urls.py
      - name: Inject Build Time and Copyright
        run: scripts/inject_copyright.sh
      - name: Build Static Website
        run: scripts/build_hugo.sh
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5