<div id="browser-warning">
  ⚠️您使用的浏览器版本过旧，可能会影响网页显示效果与安全性。
  建议更新至最新版本的
  <a href="https://www.google.com/chrome/" target="_blank">Chrome</a>、
  <a href="https://www.microsoft.com/edge/" target="_blank">Edge</a> 或
  <a href="https://www.mozilla.org/firefox/" target="_blank">Firefox</a>。
  <button id="close-warning">&times;</button>
</div>
<script>
  (function () {
    function scrollSameProvinceMenuToActiveItem() {
      var menu = document.querySelector(".same-province-menu");
      if (!menu) return;

      var activeItem = menu.querySelector("li.active");
      if (!activeItem) return;

      var targetTop = activeItem.offsetTop - menu.clientHeight / 2 + activeItem.clientHeight / 2;
      menu.scrollTop = Math.max(0, targetTop);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", scrollSameProvinceMenuToActiveItem);
    } else {
      scrollSameProvinceMenuToActiveItem();
    }
  })();
</script>
